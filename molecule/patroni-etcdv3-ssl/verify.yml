---

- name: Verify
  hosts: all
  tasks:

    - name: Remove curl-minimal
      ansible.builtin.package:
        name: curl-minimal
        state: absent

    - name: Install curl for package interaction
      ansible.builtin.package:
        name: curl

    - name: Verify etcd has a leader
      ansible.builtin.uri:
        url: https://127.0.0.1:2379/metrics
        client_cert: /opt/certs-etcd/{{ inventory_hostname }}-etcd-server.crt
        client_key: /opt/certs-etcd/{{ inventory_hostname }}.key
        validate_certs: false
        return_content: true
      register: etcd_has_leader

    - name: Show status of etcd leader
      ansible.builtin.debug:
        msg: "{{ etcd_has_leader }}"

    - name: Fail etcd cluster has no leader
      ansible.builtin.fail:
        msg: "Fail: Cluster has no leader"
      when: 'not "etcd_server_has_leader 1" in etcd_has_leader.content'

    - name: Verify Patroni instance-1 is running
      ansible.builtin.shell: |
        set -o pipefail
        patronictl
        -c /etc/patroni/{{ inventory_hostname }}.yml
        topology
        |
        grep instance-1
      args:
        executable: /bin/bash
      register: instance_1_status
      changed_when: false

    - name: Show output of patronictl topology for instance-1
      ansible.builtin.debug:
        msg: "{{ instance_1_status }}"

# Remove comments to add journal logs for debugging
#    - name: Get journalctl -xe
#      ansible.builtin.shell: >
#        journalctl -xe
#        | tail -n100
#      register: journalctl

#    - name: Show last 100 lines of journalctl
#      ansible.builtin.debug:
#        msg: "{{ journalctl.stdout_lines }}"

    - name: Fail if Patroni node instance-1 is not running
      ansible.builtin.fail:
        msg: "Fail: instance-1 is not running"
      when: instance_1_status.stdout is not search("running|streaming")

    - name: Verify Patroni instance-2 is running
      ansible.builtin.shell: |
        set -o pipefail
        patronictl
        -c /etc/patroni/{{ inventory_hostname }}.yml
        topology
        |
        grep instance-2
      args:
        executable: /bin/bash
      register: instance_2_status
      changed_when: false

    - name: Show output of patronictl topology for instance-2
      ansible.builtin.debug:
        msg: "{{ instance_2_status }}"

# Remove comments to add journal logs for debugging
#    - name: Get journalctl -xe
#      ansible.builtin.shell: >
#        journalctl -xe
#        | tail -n100
#      register: journalctl

#    - name: Show last 100 lines of journalctl
#      ansible.builtin.debug:
#        msg: "{{ journalctl.stdout_lines }}"

    - name: Fail if Patroni node instance-2 is not running
      ansible.builtin.fail:
        msg: "Fail: instance-2 is not running"
      when: instance_2_status.stdout is not search("running|streaming")

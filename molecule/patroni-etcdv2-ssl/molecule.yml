---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian11}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      # watchdog
      #- /sbin/modprobe:/sbin/modprobe:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    #network_mode: bridge
    groups:
      - patroni
  - name: instance-2
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian11}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      # watchdog
      #- /sbin/modprobe:/sbin/modprobe:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    #network_mode: bridge
    groups:
      - patroni
provisioner:
  name: ansible
verifier:
  name: ansible

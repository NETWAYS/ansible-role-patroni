---
name: CI
'on':
  pull_request:
  push:
    branches:
      - netways


jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

      - name: Check out the codebase.
        uses: actions/checkout@v4

      #- name: Set up Python 3.9
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          #python-version: '3.9'
          python-version: '3.10'

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint .

  molecule-default:
    name: Molecule (default)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      max-parallel: 1
      matrix:
        distro:
          #- debian10    # TODO
          - debian11   # TODO
          #- rockylinux8
          #- rockylinux9
        scenario:
          # - patroni-default   #TODO
          - patroni-etcdv2-ssl
          #- patroni-etcdv3-nossl   # TODO
          #- patroni-etcdv3-ssl

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      #- name: Set up Python 3.9
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          #python-version: '3.9'
          python-version: '3.10'

#      - name: Set up Docker
#        uses: docker/setup-buildx-action@v3

#      - name: Start Docker service
#        run: |
#          sudo systemctl start docker
      #- name: Downgrade modules for Docker communication
      #  run: pip3 install 'requests<2.32.0' 'docker<6.0.0' --force-reinstall

      - name: Install test dependencies.
        run: sudo apt update

      - name: Install test dependencies.
        run: sudo apt install -y libssl-dev

      #- name: Install Podman
      #  run: sudo apt install -y podman

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          #python3 -m pip install ansible ansible-lint molecule molecule-plugins[docker] pytest passlib
          python3 -m pip install ansible ansible-lint molecule molecule-docker pytest passlib requests

      - name: Run Molecule tests
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          #DOCKER_HOST: unix:///var/run/docker.sock
